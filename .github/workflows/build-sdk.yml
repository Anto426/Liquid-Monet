name: Build & Publish SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # publish to GitHub Packages Maven registry

concurrency:
  group: sdk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # R8 full mode is enabled via gradle.properties (android.enableR8.fullMode=true).
      # GITHUB_RUN_NUMBER sets the Maven patch version so every push gets a unique
      # monotonically increasing coordinate, e.g. com.anto426.liquidmonet:sdk:1.0.47
      - name: Build & publish :sdk to GitHub Packages
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 \
            :sdk:bundleReleaseAndroidLibrary \
            :sdk:publish
          echo "BUILD_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-output
          find sdk/build/outputs/aar -name "*-release.aar" | xargs -I{} cp {} release-output/
          TAG="v${BUILD_VERSION}"
          gh release create "$TAG" release-output/*.aar \
            --title "LiquidMonet SDK ${BUILD_VERSION} (build ${{ github.run_number }})" \
            --notes "Maven: \`com.anto426.liquidmonet:sdk:${BUILD_VERSION}\`
Build ${{ github.run_number }} — ${{ github.sha }}" \
            --repo "${{ github.repository }}"
